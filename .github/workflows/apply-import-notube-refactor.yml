name: Apply NoTube import refactor

on:
  push:
    branches:
      - refactor/import-notube-link

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/import-notube-link
          fetch-depth: 0

      - name: Apply one-time refactor
        run: python3 tools/refactor_import_notube.py

      - name: Validate JavaScript syntax
        run: node --check js/app.js

      - name: Validate removed interface references
        run: |
          ! grep -R -n -E 'ytImportInput|ytImportBtn|ytPreviewCard|ytPreviewSaveBtn|ytPreviewDlBtn|analyzeYouTubeUrl|saveFromYouTube|downloadToDevice' index.html js/app.js
          grep -n 'https://notube.lol/fr/youtube-app-374' index.html
          grep -n "wave-v15" sw.js

      - name: Commit generated refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo 'Aucune modification générée'; exit 1; }
          git commit -m "refactor: remplacer l’import YouTube par un lien NoTube"
          git push origin HEAD:refactor/import-notube-link
