name: Build WAVE Android APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING_KEY: ${{ secrets.WAVE_KEYSTORE_BASE64 != '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Installer le SDK Android 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-35' \
            'build-tools;35.0.0' >/dev/null

      - name: Construire l'APK de test
        shell: bash
        run: |
          mkdir -p dist
          set -o pipefail
          gradle -p android-app --no-daemon --console=plain --stacktrace clean assembleDebug \
            2>&1 | tee dist/gradle-build.log

      - name: Publier le journal de construction
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: WAVE-android-build-log
          path: dist/gradle-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Préparer l'APK de test
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk dist/WAVE-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: WAVE-debug-apk
          path: dist/WAVE-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Restaurer la clé de signature privée
        if: ${{ github.event_name != 'pull_request' && env.HAS_SIGNING_KEY == 'true' }}
        env:
          WAVE_KEYSTORE_BASE64: ${{ secrets.WAVE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$WAVE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/wave-release.jks"
          chmod 600 "$RUNNER_TEMP/wave-release.jks"

      - name: Construire l'APK privée signée
        if: ${{ github.event_name != 'pull_request' && env.HAS_SIGNING_KEY == 'true' }}
        env:
          WAVE_KEYSTORE_PATH: ${{ runner.temp }}/wave-release.jks
          WAVE_KEYSTORE_PASSWORD: ${{ secrets.WAVE_KEYSTORE_PASSWORD }}
          WAVE_KEY_ALIAS: ${{ secrets.WAVE_KEY_ALIAS }}
          WAVE_KEY_PASSWORD: ${{ secrets.WAVE_KEY_PASSWORD }}
        run: gradle -p android-app --no-daemon --console=plain assembleRelease

      - name: Préparer l'APK privée signée
        if: ${{ github.event_name != 'pull_request' && env.HAS_SIGNING_KEY == 'true' }}
        run: cp android-app/app/build/outputs/apk/release/app-release.apk dist/WAVE-release.apk

      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name != 'pull_request' && env.HAS_SIGNING_KEY == 'true' }}
        with:
          name: WAVE-release-apk
          path: dist/WAVE-release.apk
          if-no-files-found: error
          retention-days: 30
