name: Apply music ratings implementation

on:
  push:
    branches: [agent/music-ratings]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/music-ratings
      - name: Apply feature
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'Marker not found: {label}')
              return text.replace(old, new, 1)

          db_path = Path('js/db.js')
          db = db_path.read_text()
          db = replace_once(db, "const DB_VERSION = 1;", "const DB_VERSION = 2;", 'DB version')
          db = replace_once(db,
              "if (!d.objectStoreNames.contains('favorites')) d.createObjectStore('favorites', { keyPath: 'id' });",
              "if (!d.objectStoreNames.contains('favorites')) d.createObjectStore('favorites', { keyPath: 'id' });\n        if (!d.objectStoreNames.contains('ratings'))   d.createObjectStore('ratings',   { keyPath: 'id' });",
              'ratings store')
          db = replace_once(db,
              "await del('favorites', id);",
              "await del('favorites', id);\n    await del('ratings', id);",
              'rating cleanup')
          rating_api = r'''
  function normalizeRating(value) {
    const number = Number(value);
    if (!Number.isFinite(number) || number < 0.5 || number > 5 || !Number.isInteger(number * 2)) {
      throw new TypeError('La note doit être comprise entre 0,5 et 5 par pas de 0,5.');
    }
    return number;
  }

  async function getRating(id) {
    const rec = await get('ratings', id);
    return rec ? rec.value : null;
  }

  async function setRating(id, value) {
    if (!id || typeof id !== 'string') throw new TypeError('Identifiant de morceau invalide.');
    const normalized = normalizeRating(value);
    const previous = await get('ratings', id);
    const now = Date.now();
    await put('ratings', {
      id,
      value: normalized,
      ratedAt: previous?.ratedAt || now,
      updatedAt: now,
    });
    return normalized;
  }

  async function removeRating(id) {
    await del('ratings', id);
  }

  async function getRatings() {
    return await getAll('ratings');
  }

'''
          db = replace_once(db, "  const PLAYLIST_COLORS =", rating_api + "  const PLAYLIST_COLORS =", 'rating API insertion')
          db = replace_once(db,
              "    getRecent,\n    getPlaylists,",
              "    getRecent,\n    getRating,\n    setRating,\n    removeRating,\n    getRatings,\n    getPlaylists,",
              'rating API exports')
          db_path.write_text(db)

          index_path = Path('index.html')
          index = index_path.read_text()
          index = replace_once(index,
              '<link rel="stylesheet" href="./css/style.css">',
              '<link rel="stylesheet" href="./css/style.css">\n  <link rel="stylesheet" href="./css/ratings.css">',
              'ratings stylesheet')
          index = replace_once(index,
              '<button class="tab-btn" data-tab="favorites">Favoris</button>',
              '<button class="tab-btn" data-tab="favorites">Favoris</button>\n          <button class="tab-btn" data-tab="rated">Notés</button>',
              'rated tab')
          index = replace_once(index, '</body>', '  <script src="./js/ratings.js"></script>\n</body>', 'ratings script')
          index_path.write_text(index)

          ratings_js = r'''/**
 * WAVE — Personal music ratings (0.5 to 5 stars).
 * Runs as a small enhancement layer so the existing player stays isolated.
 */
(() => {
  'use strict';

  const STAR = '★';
  const EMPTY_STAR = '☆';
  let activeTrackId = null;
  let draftValue = null;
  let ratingCache = new Map();
  let refreshTimer = null;

  const escapeHtml = (value) => String(value ?? '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

  function formatRating(value) {
    return Number(value).toLocaleString('fr-FR', { minimumFractionDigits: Number(value) % 1 ? 1 : 0, maximumFractionDigits: 1 });
  }

  function starsText(value) {
    const rounded = Math.round(Number(value || 0) * 2) / 2;
    const full = Math.floor(rounded);
    return STAR.repeat(full) + (rounded % 1 ? '½' : '') + EMPTY_STAR.repeat(Math.max(0, 5 - Math.ceil(rounded)));
  }

  async function reloadRatings() {
    ratingCache = new Map((await DB.getRatings()).map(r => [r.id, r.value]));
  }

  function currentTrack() {
    try { return window.Player?.getCurrentTrack?.() || null; } catch { return null; }
  }

  function dispatchChanged(trackId, value) {
    document.dispatchEvent(new CustomEvent('wave:rating-changed', { detail: { trackId, value } }));
  }

  function ensureModal() {
    if (document.querySelector('#ratingModal')) return;
    const modal = document.createElement('div');
    modal.id = 'ratingModal';
    modal.className = 'rating-modal';
    modal.hidden = true;
    modal.innerHTML = `
      <div class="rating-dialog" role="dialog" aria-modal="true" aria-labelledby="ratingModalTitle">
        <button class="rating-close" type="button" aria-label="Fermer">×</button>
        <img class="rating-artwork" alt="">
        <h2 id="ratingModalTitle">Noter ce morceau</h2>
        <p class="rating-track-name"></p>
        <div class="rating-stars" role="radiogroup" aria-label="Note sur 5"></div>
        <output class="rating-value">Aucune note</output>
        <div class="rating-actions">
          <button class="rating-remove" type="button">Supprimer la note</button>
          <button class="rating-save" type="button">Valider</button>
        </div>
      </div>`;
    document.body.appendChild(modal);
    modal.addEventListener('click', e => { if (e.target === modal || e.target.closest('.rating-close')) closeModal(); });
    modal.querySelector('.rating-save').addEventListener('click', saveDraft);
    modal.querySelector('.rating-remove').addEventListener('click', removeActiveRating);
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && !modal.hidden) closeModal(); });
  }

  function renderPicker() {
    const modal = document.querySelector('#ratingModal');
    if (!modal) return;
    const group = modal.querySelector('.rating-stars');
    group.innerHTML = '';
    for (let half = 1; half <= 10; half++) {
      const value = half / 2;
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'rating-half-step';
      button.dataset.value = String(value);
      button.setAttribute('role', 'radio');
      button.setAttribute('aria-label', `Noter ${formatRating(value)} sur 5`);
      button.setAttribute('aria-checked', String(draftValue === value));
      button.title = `${formatRating(value)} / 5`;
      button.innerHTML = `<span aria-hidden="true">${half % 2 ? '◐' : STAR}</span>`;
      if (draftValue != null && value <= draftValue) button.classList.add('selected');
      button.addEventListener('click', () => { draftValue = value; renderPicker(); });
      group.appendChild(button);
    }
    modal.querySelector('.rating-value').textContent = draftValue == null ? 'Aucune note' : `${starsText(draftValue)}  ${formatRating(draftValue)} / 5`;
    modal.querySelector('.rating-remove').hidden = !ratingCache.has(activeTrackId);
  }

  async function openModal(trackId) {
    ensureModal();
    const tracks = await DB.getUserTracks();
    const track = tracks.find(t => t.id === trackId);
    if (!track) return;
    activeTrackId = track.id;
    draftValue = ratingCache.get(track.id) ?? null;
    const modal = document.querySelector('#ratingModal');
    modal.querySelector('.rating-track-name').textContent = `${track.artist || 'Artiste inconnu'} — ${track.title || 'Sans titre'}`;
    const art = modal.querySelector('.rating-artwork');
    art.src = track.coverArt || './assets/icons/icon-192-v2.png';
    art.alt = `Pochette de ${track.title || 'ce morceau'}`;
    renderPicker();
    modal.hidden = false;
    modal.querySelector('.rating-half-step')?.focus();
  }

  function closeModal() {
    const modal = document.querySelector('#ratingModal');
    if (modal) modal.hidden = true;
    activeTrackId = null;
    draftValue = null;
  }

  async function saveDraft() {
    if (!activeTrackId || draftValue == null) return;
    const value = await DB.setRating(activeTrackId, draftValue);
    ratingCache.set(activeTrackId, value);
    dispatchChanged(activeTrackId, value);
    closeModal();
    scheduleRefresh();
  }

  async function removeActiveRating() {
    if (!activeTrackId) return;
    const id = activeTrackId;
    await DB.removeRating(id);
    ratingCache.delete(id);
    dispatchChanged(id, null);
    closeModal();
    scheduleRefresh();
  }

  function makeBadge(trackId) {
    const value = ratingCache.get(trackId);
    if (value == null) return null;
    const badge = document.createElement('button');
    badge.type = 'button';
    badge.className = 'track-rating-badge';
    badge.dataset.ratingFor = trackId;
    badge.setAttribute('aria-label', `Note ${formatRating(value)} sur 5. Modifier la note.`);
    badge.innerHTML = `<span aria-hidden="true">★</span> ${formatRating(value)}`;
    badge.addEventListener('click', e => { e.stopPropagation(); openModal(trackId); });
    return badge;
  }

  function decorateTrackRows() {
    document.querySelectorAll('.track-item[data-track-id]').forEach(item => {
      const id = item.dataset.trackId;
      item.querySelector('.track-rating-badge')?.remove();
      const badge = makeBadge(id);
      const actions = item.querySelector('.track-actions');
      if (badge && actions) actions.insertBefore(badge, actions.firstChild);
    });
  }

  function ensurePlayerButtons() {
    const configs = [
      ['.player-track-info', 'playerRatingButton'],
      ['#nowPlayingScreen', 'nowPlayingRatingButton'],
    ];
    for (const [selector, id] of configs) {
      const host = document.querySelector(selector);
      if (!host || document.querySelector(`#${id}`)) continue;
      const button = document.createElement('button');
      button.id = id;
      button.type = 'button';
      button.className = 'player-rating-button';
      button.setAttribute('aria-label', 'Noter le morceau en cours');
      button.addEventListener('click', e => {
        e.stopPropagation();
        const track = currentTrack();
        if (track?.id) openModal(track.id);
      });
      host.appendChild(button);
    }
    updatePlayerButtons();
  }

  function updatePlayerButtons() {
    const track = currentTrack();
    const value = track?.id ? ratingCache.get(track.id) : null;
    document.querySelectorAll('.player-rating-button').forEach(button => {
      button.disabled = !track?.id;
      button.innerHTML = value == null ? '<span aria-hidden="true">☆</span><span>Noter</span>' : `<span aria-hidden="true">★</span><span>${formatRating(value)}</span>`;
      button.setAttribute('aria-label', value == null ? 'Noter le morceau en cours' : `Note ${formatRating(value)} sur 5. Modifier la note.`);
    });
  }

  function injectOptionsAction() {
    const list = document.querySelector('#optionsList');
    if (!list || !activeTrackId || list.querySelector('.rating-options-item')) return;
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'options-item rating-options-item';
    button.innerHTML = '<span class="rating-option-star" aria-hidden="true">★</span><span>Noter ce morceau</span>';
    button.addEventListener('click', () => {
      document.querySelector('#optionsOverlay').hidden = true;
      openModal(activeTrackId);
    });
    list.insertBefore(button, list.firstChild);
  }

  function ensureRatedTab() {
    const button = document.querySelector('.library-tabs [data-tab="rated"]');
    if (!button || button.dataset.ratingBound) return;
    button.dataset.ratingBound = 'true';
    button.addEventListener('click', () => setTimeout(renderRatedView, 0));
  }

  async function renderRatedView() {
    const active = document.querySelector('.library-tabs .tab-btn.active');
    if (active?.dataset.tab !== 'rated') return;
    const content = document.querySelector('#libraryContent');
    if (!content) return;
    const tracks = await DB.getUserTracks();
    const rated = tracks.filter(t => ratingCache.has(t.id)).sort((a, b) => ratingCache.get(b.id) - ratingCache.get(a.id));
    content.innerHTML = '<div class="rated-toolbar"><strong>Morceaux notés</strong><button type="button" id="ratedSortDirection">Meilleures notes d’abord</button></div><div class="track-list rated-track-list"></div>';
    const list = content.querySelector('.rated-track-list');
    if (!rated.length) { list.innerHTML = '<p class="empty-state">Aucun morceau noté.</p>'; return; }
    const draw = items => {
      list.innerHTML = '';
      for (const track of items) {
        const row = document.createElement('button');
        row.type = 'button';
        row.className = 'rated-track-card';
        row.dataset.trackId = track.id;
        row.innerHTML = `<img src="${escapeHtml(track.coverArt || './assets/icons/icon-192-v2.png')}" alt=""><span class="rated-track-copy"><strong>${escapeHtml(track.title)}</strong><small>${escapeHtml(track.artist || 'Artiste inconnu')}</small></span><span class="rated-card-score">★ ${formatRating(ratingCache.get(track.id))}</span>`;
        row.addEventListener('click', () => { Player.setQueue(items, items.indexOf(track)); Player.play(track); });
        row.addEventListener('contextmenu', e => { e.preventDefault(); openModal(track.id); });
        list.appendChild(row);
      }
    };
    draw(rated);
    let desc = true;
    content.querySelector('#ratedSortDirection').addEventListener('click', e => {
      desc = !desc;
      e.currentTarget.textContent = desc ? 'Meilleures notes d’abord' : 'Notes les plus basses d’abord';
      draw([...rated].sort((a, b) => (ratingCache.get(b.id) - ratingCache.get(a.id)) * (desc ? 1 : -1)));
    });
  }

  function ensureGlobalRatingSort() {
    document.querySelectorAll('.sort-row').forEach(row => {
      if (row.querySelector('[data-sort="rating"]')) return;
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'sort-btn';
      button.dataset.sort = 'rating';
      button.textContent = 'Note ↓';
      let desc = true;
      button.addEventListener('click', () => {
        desc = !desc;
        button.textContent = `Note ${desc ? '↓' : '↑'}`;
        const container = row.parentElement?.querySelector('.track-list');
        if (!container) return;
        const wraps = [...container.querySelectorAll('.track-item-wrap')];
        wraps.sort((a, b) => {
          const av = ratingCache.get(a.querySelector('.track-item')?.dataset.trackId) ?? -1;
          const bv = ratingCache.get(b.querySelector('.track-item')?.dataset.trackId) ?? -1;
          return (bv - av) * (desc ? 1 : -1);
        });
        wraps.forEach(w => container.appendChild(w));
      });
      row.appendChild(button);
    });
  }

  function scheduleRefresh() {
    clearTimeout(refreshTimer);
    refreshTimer = setTimeout(() => {
      decorateTrackRows();
      ensurePlayerButtons();
      ensureRatedTab();
      ensureGlobalRatingSort();
      injectOptionsAction();
      renderRatedView();
    }, 30);
  }

  document.addEventListener('click', event => {
    const options = event.target.closest('.track-options-btn');
    if (options) activeTrackId = options.closest('.track-item')?.dataset.trackId || null;
  }, true);

  document.addEventListener('wave:rating-changed', scheduleRefresh);
  new MutationObserver(scheduleRefresh).observe(document.documentElement, { childList: true, subtree: true, attributes: true, attributeFilter: ['class', 'hidden'] });
  setInterval(updatePlayerButtons, 1000);

  async function init() {
    try {
      await reloadRatings();
      ensureModal();
      scheduleRefresh();
    } catch (error) {
      console.error('WAVE ratings initialization failed', error);
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init, { once: true });
  else init();
})();
'''
          Path('js/ratings.js').write_text(ratings_js)

          ratings_css = r'''.track-rating-badge,.player-rating-button{border:0;background:rgba(255,204,0,.12);color:#ffcc00;border-radius:999px;display:inline-flex;align-items:center;gap:4px;font:inherit;font-size:12px;font-weight:700;padding:5px 8px;cursor:pointer;white-space:nowrap}.track-rating-badge:hover,.player-rating-button:hover{background:rgba(255,204,0,.22)}.player-rating-button{margin-left:8px}.player-rating-button:disabled{opacity:.4;cursor:default}.rating-modal{position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,.76);display:grid;place-items:center;padding:20px}.rating-modal[hidden]{display:none}.rating-dialog{position:relative;width:min(420px,100%);background:#151515;border:1px solid #303030;border-radius:20px;padding:26px;text-align:center;box-shadow:0 24px 80px rgba(0,0,0,.5)}.rating-close{position:absolute;right:14px;top:10px;border:0;background:transparent;color:#aaa;font-size:30px;cursor:pointer}.rating-artwork{width:92px;height:92px;object-fit:cover;border-radius:14px;background:#222}.rating-dialog h2{margin:14px 0 5px}.rating-track-name{color:#aaa;margin:0 0 18px;overflow-wrap:anywhere}.rating-stars{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;margin:10px auto;max-width:350px}.rating-half-step{min-width:0;border:0;background:transparent;color:#555;font-size:25px;padding:8px 0;cursor:pointer;border-radius:7px}.rating-half-step.selected{color:#ffcc00}.rating-half-step:focus-visible{outline:2px solid #fff;outline-offset:2px}.rating-value{display:block;min-height:28px;color:#ffcc00;font-weight:800;margin:10px 0 18px}.rating-actions{display:flex;gap:10px;justify-content:center}.rating-actions button{border:0;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer}.rating-remove{background:#2b2b2b;color:#ddd}.rating-save{background:#ffcc00;color:#111}.rating-option-star{width:24px;color:#ffcc00;font-size:19px}.rated-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.rated-toolbar button{border:1px solid #343434;background:#202020;color:#ddd;border-radius:9px;padding:8px 10px}.rated-track-list{display:grid;gap:8px}.rated-track-card{width:100%;border:0;background:#171717;color:inherit;border-radius:12px;padding:9px;display:flex;align-items:center;gap:11px;text-align:left;cursor:pointer}.rated-track-card:hover{background:#202020}.rated-track-card img{width:48px;height:48px;object-fit:cover;border-radius:8px}.rated-track-copy{display:flex;flex-direction:column;min-width:0;flex:1}.rated-track-copy strong,.rated-track-copy small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rated-track-copy small{color:#999;margin-top:3px}.rated-card-score{color:#ffcc00;font-weight:800;white-space:nowrap}@media(max-width:700px){.track-rating-badge{padding:4px 6px}.rating-dialog{padding:22px 16px}.rating-stars{gap:0}.rating-half-step{font-size:21px}.player-rating-button{font-size:11px;padding:5px 7px}.rated-toolbar{align-items:flex-start;flex-direction:column}}@media(prefers-reduced-motion:reduce){.rating-modal *{scroll-behavior:auto!important;transition:none!important}}
'''
          Path('css/ratings.css').write_text(ratings_css)

          for sw_name in ('sw.js', 'js/sw.js'):
              path = Path(sw_name)
              if not path.exists(): continue
              sw = path.read_text()
              sw = re.sub(r"(CACHE(?:_NAME)?\s*=\s*['\"][^'\"]*?)(\d+)(['\"])", lambda m: f"{m.group(1)}{int(m.group(2))+1}{m.group(3)}", sw, count=1)
              if './js/app.js' in sw and './js/ratings.js' not in sw:
                  sw = sw.replace("'./js/app.js'", "'./js/app.js',\n  './js/ratings.js'", 1)
              if './css/style.css' in sw and './css/ratings.css' not in sw:
                  sw = sw.replace("'./css/style.css'", "'./css/style.css',\n  './css/ratings.css'", 1)
              path.write_text(sw)

          Path('.github/workflows/apply-music-ratings.yml').unlink()
          PY
      - name: Validate JavaScript syntax
        run: |
          node --check js/db.js
          node --check js/ratings.js
          node --check js/app.js
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/db.js js/ratings.js css/ratings.css index.html sw.js js/sw.js .github/workflows/apply-music-ratings.yml
          git commit -m "feat: add personal music ratings"
          git push origin HEAD:agent/music-ratings
