name: Apply Android bridge bootstrap fix on main

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Corriger le chargement initial du pont Samsung
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          index_path = Path('index.html')
          html = index_path.read_text(encoding='utf-8')
          old_connect = "connect-src 'self' https://wave-docker.onrender.com https://fonts.googleapis.com;"
          new_connect = "connect-src 'self' https://wave-docker.onrender.com https://fonts.googleapis.com http://127.0.0.1:8765 http://localhost:8765;"
          if old_connect in html:
              html = html.replace(old_connect, new_connect, 1)
          elif new_connect not in html:
              raise SystemExit('Directive connect-src inattendue')

          app_script = '  <script src="./js/app.js"></script>'
          bridge_script = '  <script src="./js/samsung-bridge.js"></script>'
          if bridge_script not in html:
              if app_script not in html:
                  raise SystemExit('Balise app.js introuvable')
              html = html.replace(app_script, f'{bridge_script}\n{app_script}', 1)
          index_path.write_text(html, encoding='utf-8')

          sw_path = Path('sw.js')
          sw = sw_path.read_text(encoding='utf-8')
          sw, count = re.subn(r"const CACHE_NAME = 'wave-v\d+';", "const CACHE_NAME = 'wave-v18';", sw, count=1)
          if count != 1:
              raise SystemExit('Nom du cache introuvable')
          sw_path.write_text(sw, encoding='utf-8')
          PY

      - name: Vérifier
        run: |
          grep -q 'http://127.0.0.1:8765' index.html
          grep -q './js/samsung-bridge.js' index.html
          grep -q 'wave-v18' sw.js
          node --check js/samsung-bridge.js
          node --check sw.js

      - name: Publier
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Correctif déjà appliqué.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git commit -m 'fix: charger le pont Samsung dès le premier écran Android'
          git push origin HEAD:main

