services:
  - type: web
    name: wave-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: FRONTEND_ORIGINS
        value: https://shuumy.github.io
      - key: POT_PROVIDER_URL
        value: http://127.0.0.1:4416
